<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #4a90e2, #2c3e50);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background-color: #ffffff;
      width: 360px;
      padding: 40px 35px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .login-card h2 {
      margin: 0 0 30px 0;
      text-align: center;
      color: #2c3e50;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #4a90e2;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background-color: #4a90e2;
      color: white;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #3a7bc8;
    }

    .forgot-text {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }

    .forgot-text a {
      color: #4a90e2;
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Login</h2>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" data-testid="username-input">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" data-testid="password-input">
    </div>


<form id="myForm" action="ControlsPractice.html" method="get" target="_blank">
        	<button data-testid="submit-btn">Sign In</button>
<button type="reset" class="cancel">Cancel</button>
	</form>


    

    <p class="forgot-text">
      Forgot your password?
      <a href="#" data-testid="reset-password-link">Reset Password</a>
    </p>
  </div>

</body>
</html>
