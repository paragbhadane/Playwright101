<!DOCTYPE html>
<html>
<head>
  <title>IFrames Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 40px;
    }
    iframe {
      border: 2px solid #4a90e2;
      border-radius: 6px;
      width: 350px;
      height: 150px;
    }
    h3 {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>

  <h2>Main Page</h2>
  <button id="mainBtn">Main Page Button</button>

  <!-- Frame 1: no name, will be accessed by INDEX -->
  <h3>Frame 1 (access by index)</h3>
  <iframe id="frame1" srcdoc="
    <html>
      <body style='font-family:Arial;text-align:center;margin-top:30px;'>
        <h3>This is Frame 1</h3>
        <button id='frame1Btn' onclick=&quot;document.getElementById('frame1Result').innerText='Frame 1 button clicked!'&quot;>Click Me</button>
        <p id='frame1Result'></p>
      </body>
    </html>
  ">
  </iframe>

  <!-- Frame 2: has a NAME attribute -->
  <h3>Frame 2 (access by name)</h3>
  <iframe id="frame2" name="frameByName" srcdoc="
    <html>
      <body style='font-family:Arial;text-align:center;margin-top:30px;'>
        <h3>This is Frame 2</h3>
        <input type='text' id='frame2Input' placeholder='Type here'>
      </body>
    </html>
  ">
  </iframe>

  <!-- Frame 3: no name, will be accessed by WEBELEMENT locator -->
  <h3>Frame 3 (access by WebElement)</h3>
  <iframe id="frame3" class="thirdFrame" srcdoc="
    <html>
      <body style='font-family:Arial;text-align:center;margin-top:30px;'>
        <h3>This is Frame 3</h3>
        <select id='frame3Dropdown'>
          <option value=''>Select</option>
          <option value='one'>One</option>
          <option value='two'>Two</option>
        </select>
      </body>
    </html>
  ">
  </iframe>

  <!-- Frame 4: OUTER frame, which itself contains an INNER frame (nested frames) -->
  <h3>Frame 4 (nested frames)</h3>
  <iframe id="outerFrame" srcdoc="
    <html>
      <body style='font-family:Arial;text-align:center;margin-top:20px;'>
        <h4>This is the Outer Frame</h4>
        <iframe id='innerFrame' src='innerFrame.html' style='width:280px;height:120px;border:1px dashed #999;'></iframe>
      </body>
    </html>
  ">
  </iframe>


  <script>
    document.getElementById("mainBtn").addEventListener("click", function () {
      alert("You clicked the Main Page button, not inside a frame!");
    });
  </script>

</body>
</html>
