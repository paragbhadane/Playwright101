<!DOCTYPE html>
<html>
<head>
  <title>File Upload Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 60px;
    }

    .upload-box {
      border: 2px dashed #4a90e2;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      width: 350px;
    }

    input[type="file"] {
      margin: 20px 0;
      font-size: 14px;
    }

    button {
      padding: 10px 20px;
      font-size: 15px;
      cursor: pointer;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 10px;
    }

    #result {
      margin-top: 30px;
      font-size: 15px;
      color: #333;
    }

    #fileName {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h2>File Upload Demo</h2>

  <div class="upload-box">
    <p>Select a file to upload</p>
    <input type="file" id="fileInput">
    <p id="fileName"></p>
    <button id="uploadBtn">Upload</button>
  </div>

  <p id="result"></p>

  <script>
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const result = document.getElementById("result");

    // Show selected file name as soon as a file is chosen
    fileInput.addEventListener("change", function () {
      if (fileInput.files.length > 0) {
        fileName.innerText = "Selected file: " + fileInput.files[0].name;
      } else {
        fileName.innerText = "";
      }
    });

    // Simulate an "upload" action
    document.getElementById("uploadBtn").addEventListener("click", function () {
      if (fileInput.files.length > 0) {
        result.innerText = "File '" + fileInput.files[0].name + "' uploaded successfully!";
      } else {
        result.innerText = "Please select a file before uploading.";
      }
    });
  </script>

</body>
</html>
