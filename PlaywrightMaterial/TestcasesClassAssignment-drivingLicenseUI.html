<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driving License Application</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      padding: 20px;
    }
    .form-container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 25px;
      max-width: 500px;
      margin: auto;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="number"],
    input[type="file"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 8px;
    }
    .checkbox-group label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .button-group {
      text-align: center;
      margin-top: 25px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 0 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    button.cancel {
      background-color: #dc3545;
    }
    button:hover {
      opacity: 0.9;
    }
  .form-group {
    margin-bottom: 20px;
    font-family: Arial, sans-serif;
  }

  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #333;
    font-size: 14px;
  }

  select[multiple] {
    width: 100%;
    max-width: 300px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background-color: #fff;
    font-size: 14px;
    color: #333;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  select[multiple]:focus {
    border-color: #4a90e2;
    box-shadow: 0 0 4px rgba(74, 144, 226, 0.4);
  }

  select[multiple] option {
    padding: 8px 10px;
    border-radius: 4px;
  }

  select[multiple] option:checked {
    background: #4a90e2;
    color: #fff;
  }

  select[multiple] option:hover {
    background-color: #eaf2fd;
  }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Driving License Application</h2>
    <form>

      <label for="licenseType">License type</label>
      <select name="licenseType" id="licenseType">
  	  <option value="">Select license type</option>
  	  <option value="permanent">Permanent</option>
  	  <option value="learning">Learning</option>
      </select>

      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="address">Address</label>
      <input type="text" id="address" name="address" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="1" max="120" required>

      <label for="placeofbirth">Place of Birth</label>
      <input type="text" id="placeofbirth" name="placeofbirth" required>

      <label>Gender</label>
      <div class="checkbox-group">
        <label><input type="radio" name="gender" id='Male'> Male</label>
        <label><input type="radio" name="gender" id='Female'> Female</label>
      </div>

      <label>Color Blindness</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="color_yes"> Yes</label>
        <label><input type="checkbox" name="color_no"> No</label>
      </div>

      <label for="languages">Languages known</label>
	<select name="languages" id="languages" multiple>
  	  <option value="english">English</option>
  	  <option value="hindi">Hindi</option>
  	  <option value="marathi">Marathi</option>
  	  <option value="japanese">Japanese</option>
	</select>

      <label for="identity">Upload Identity Documents</label>
      <input type="file" id="identity" name="identity" accept=".jpg,.png,.pdf">
</form>
      <div class="button-group">
	<form id="myForm" action="welcome.html" method="get" target="_blank">
        	<button type="submit">Submit</button>
<button type="reset" class="cancel">Cancel</button>
	</form>
        
      </div>
    
  </div>
</body>
</html>
